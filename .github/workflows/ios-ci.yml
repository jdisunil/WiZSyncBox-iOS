name: iOS compile and unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iOS Simulator (no signing)
        run: |
          xcodebuild -project WiZSyncBox.xcodeproj -scheme WiZSyncBox -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests (available iPhone simulator)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for arr in d.values() for x in arr if "iPhone" in x["name"]))')
          xcodebuild -project WiZSyncBox.xcodeproj -scheme WiZSyncBox -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
