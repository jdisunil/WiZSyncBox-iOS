name: WiZSyncBox
options:
  bundleIdPrefix: com.wizsyncbox
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "WiZ Sync Box sends colour commands to WiZ bulbs on your home Wi-Fi network."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SUPPORTS_MACCATALYST: NO
targets:
  WiZSyncBox:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizsyncbox.ios
  WiZSyncBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: WiZSyncBox
